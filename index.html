<!doctype html><html lang='it'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Affiancamenti – Governance Medicale</title>
<style>
:root{--b:#17365d;--p:#eaf2f8;--line:#d7dde5;--txt:#1d2733;--mut:#687385;--bg:#f5f7fa;--ok:#e8f3ec;--mid:#fff6dd;--low:#fbe9e7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--txt)}header{background:var(--b);color:white;padding:18px 28px}header h1{margin:0;font-size:22px}header small{opacity:.85}.wrap{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 75px)}aside{background:white;border-right:1px solid var(--line);padding:18px}.search{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;margin-bottom:12px}.ops{max-height:70vh;overflow:auto}.op{padding:9px 10px;border-radius:6px;cursor:pointer}.op:hover,.op.active{background:var(--p);font-weight:bold}.main{padding:24px;max-width:1200px}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px;box-shadow:0 1px 2px #0000000a}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1}h2,h3{margin-top:0;color:var(--b)}label{display:block;font-size:12px;color:var(--mut);margin:5px 0}select,input,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font:inherit}textarea{min-height:72px;resize:vertical}.area{display:grid;grid-template-columns:230px 190px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}.area:first-of-type{border-top:0}.area b{padding-top:10px}.btn{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;background:var(--b);color:white;font-weight:bold}.btn.secondary{background:#687385}.btn.danger{background:#9c3b35}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.evidence{border-top:1px solid var(--line);padding:14px 0}.meta{font-size:12px;color:var(--mut);margin-bottom:6px}.tag{display:inline-block;padding:3px 8px;border-radius:20px;font-size:12px}.positive{background:var(--ok)}.improve{background:var(--low)}.neutral{background:#eef1f5}.empty{color:var(--mut);font-style:italic}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modalbox{background:white;width:min(850px,100%);max-height:90vh;overflow:auto;border-radius:10px;padding:20px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid1{display:grid;gap:12px}@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.ops{max-height:220px}.area{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Affiancamenti – Governance Medicale</h1><small>Strumento interno di osservazione e follow-up</small></header>
<div class='wrap'><aside><input id='search' class='search' placeholder='Cerca operatore…'><div id='ops' class='ops'></div><div class='toolbar'><button class='btn secondary' onclick='exportData()'>💾 SALVA DATI</button><label class='btn secondary' style='display:inline-block;color:white;margin:0'>📂 CARICA DATI<input id='importFile' type='file' accept='.json' style='display:none'></label></div></aside>
<main class='main'><div id='content'></div></main></div>
<div id='modal' class='modal'><div class='modalbox'><h3 id='modalTitle'>Nuova evidenza</h3><div class='grid2'><div><label>Data</label><input id='evDate' type='date'></div><div><label>Tipologia</label><select id='evType'><option value='positive'>Evidenza positiva</option><option value='improve'>Aspetto da consolidare</option><option value='neutral'>Neutra / informativa</option></select></div></div><div class='grid1'>
<div><label>Casistica</label><input id='evCase'></div><div><label>Evidenza osservata</label><textarea id='evObs'></textarea></div><div><label>Comportamento / procedura attesa</label><textarea id='evExpected'></textarea></div><div><label>Feedback fornito</label><textarea id='evFeedback'></textarea></div><div><label>Riscontro dell’operatore</label><textarea id='evResponse'></textarea></div><div><label>Elementi di contesto</label><textarea id='evContext'></textarea></div><div><label>Follow-up</label><textarea id='evFollow'></textarea></div></div><div class='toolbar'><button class='btn' onclick='saveEvidence()'>Salva evidenza</button><button class='btn secondary' onclick='closeModal()'>Annulla</button></div></div></div>
<script>
const DEFAULT_OPERATORS = [];
let operators = [];

const areas=[['technical','Competenza tecnico-operativa'],['tools','Utilizzo degli strumenti di supporto'],['call','Gestione della chiamata e dell’operatività'],['communication','Competenza comunicativa']];
let selected='', editing=null;
let db=JSON.parse(localStorage.getItem('governanceMedicaleV2')||'{}');
operators=Object.keys(db).sort((a,b)=>a.localeCompare(b,'it'));
selected=operators[0]||'';
function blank(){return {updated:'',observer:'',awareness:'',areas:{technical:{level:'',note:''},tools:{level:'',note:''},call:{level:'',note:''},communication:{level:'',note:''}},evidence:[]}}
function rec(){if(!selected)return blank();if(!db[selected])db[selected]=blank();return db[selected]}
function persist(){localStorage.setItem('governanceMedicaleV2',JSON.stringify(db))}
function renderOps(filter=''){let box=document.getElementById('ops');box.innerHTML='';if(!operators.length){box.innerHTML="<p class='empty'>Nessun archivio caricato.<br>Usa 📂 CARICA DATI.</p>";return;}operators.filter(x=>x.toLowerCase().includes(filter.toLowerCase())).forEach(n=>{let d=document.createElement('div');d.className='op'+(n===selected?' active':'');d.textContent=n;d.onclick=()=>{selected=n;renderOps(document.getElementById('search').value);render()};box.appendChild(d)})}
function levelOptions(v){return `<option value=''></option><option ${v==='Consolidato'?'selected':''}>Consolidato</option><option ${v==='Adeguato'?'selected':''}>Adeguato</option><option ${v==='Da consolidare'?'selected':''}>Da consolidare</option>`}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){if(!selected){document.getElementById('content').innerHTML="<div class='card'><h2>Carica l’archivio Governance</h2><p>Per iniziare usa <b>📂 CARICA DATI</b> e seleziona il file <b>Affiancamenti_Governance_Dati.json</b> conservato su SharePoint/OneDrive.</p><p class='empty'>Il file pubblicato su GitHub non contiene nomi di operatori né dati di affiancamento.</p></div>";return;}let r=rec();let ev=[...r.evidence].sort((a,b)=>(b.date||'').localeCompare(a.date||''));document.getElementById('content').innerHTML=`
<div class='card'><div class='row'><div class='grow'><h2>${esc(selected)}</h2></div><div><label>Ultimo aggiornamento</label><input type='date' id='updated' value='${esc(r.updated)}' onchange='saveGeneral()'></div><div><label>Osservatore</label><input id='observer' value='${esc(r.observer)}' onchange='saveGeneral()'></div></div></div>
<div class='card'><h3>Quadro generale</h3>${areas.map(([k,t])=>`<div class='area'><b>${t}</b><div><label>Valutazione</label><select id='lvl_${k}' onchange='saveGeneral()'>${levelOptions(r.areas[k].level)}</select></div><div><label>Nota</label><textarea id='note_${k}' onchange='saveGeneral()'>${esc(r.areas[k].note)}</textarea></div></div>`).join('')}<div style='border-top:1px solid var(--line);padding-top:14px'><label><b>Consapevolezza professionale / risposta al feedback</b></label><textarea id='awareness' onchange='saveGeneral()'>${esc(r.awareness)}</textarea></div></div>
<div class='card'><div class='row'><div class='grow'><h3 style='margin:0'>Evidenze osservate</h3></div><button class='btn' onclick='newEvidence()'>+ Nuova evidenza</button></div>${ev.length?ev.map(e=>`<div class='evidence'><div class='meta'>${esc(e.date||'Senza data')} · <span class='tag ${e.type}'>${e.type==='positive'?'Evidenza positiva':e.type==='improve'?'Aspetto da consolidare':'Neutra / informativa'}</span></div><b>${esc(e.case||'Casistica non indicata')}</b><p><b>Evidenza:</b> ${esc(e.obs)}</p>${e.expected?`<p><b>Atteso:</b> ${esc(e.expected)}</p>`:''}${e.feedback?`<p><b>Feedback:</b> ${esc(e.feedback)}</p>`:''}${e.response?`<p><b>Riscontro:</b> ${esc(e.response)}</p>`:''}${e.context?`<p><b>Contesto:</b> ${esc(e.context)}</p>`:''}${e.follow?`<p><b>Follow-up:</b> ${esc(e.follow)}</p>`:''}<div class='toolbar'><button class='btn secondary' onclick="editEvidence('${e.id}')">Modifica</button><button class='btn danger' onclick="deleteEvidence('${e.id}')">Elimina</button></div></div>`).join(''):`<p class='empty'>Nessuna evidenza registrata.</p>`}</div>`}
function saveGeneral(){let r=rec();r.updated=document.getElementById('updated').value;r.observer=document.getElementById('observer').value;r.awareness=document.getElementById('awareness').value;areas.forEach(([k])=>{r.areas[k].level=document.getElementById('lvl_'+k).value;r.areas[k].note=document.getElementById('note_'+k).value});persist()}
function newEvidence(){editing=null;document.getElementById('modalTitle').textContent='Nuova evidenza';['evCase','evObs','evExpected','evFeedback','evResponse','evContext','evFollow'].forEach(id=>document.getElementById(id).value='');document.getElementById('evDate').value=new Date().toISOString().slice(0,10);document.getElementById('evType').value='neutral';document.getElementById('modal').classList.add('open')}
function editEvidence(id){let e=rec().evidence.find(x=>x.id===id);if(!e)return;editing=id;document.getElementById('modalTitle').textContent='Modifica evidenza';document.getElementById('evDate').value=e.date||'';document.getElementById('evType').value=e.type||'neutral';document.getElementById('evCase').value=e.case||'';document.getElementById('evObs').value=e.obs||'';document.getElementById('evExpected').value=e.expected||'';document.getElementById('evFeedback').value=e.feedback||'';document.getElementById('evResponse').value=e.response||'';document.getElementById('evContext').value=e.context||'';document.getElementById('evFollow').value=e.follow||'';document.getElementById('modal').classList.add('open')}
function saveEvidence(){let e={id:editing||('e'+Date.now()),date:document.getElementById('evDate').value,type:document.getElementById('evType').value,case:document.getElementById('evCase').value,obs:document.getElementById('evObs').value,expected:document.getElementById('evExpected').value,feedback:document.getElementById('evFeedback').value,response:document.getElementById('evResponse').value,context:document.getElementById('evContext').value,follow:document.getElementById('evFollow').value};let r=rec();if(editing){let i=r.evidence.findIndex(x=>x.id===editing);r.evidence[i]=e}else r.evidence.push(e);r.updated=new Date().toISOString().slice(0,10);persist();closeModal();render()}
function deleteEvidence(id){if(confirm('Eliminare questa evidenza?')){let r=rec();r.evidence=r.evidence.filter(x=>x.id!==id);persist();render()}}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function exportData(){let blob=new Blob([JSON.stringify({version:2,exported:new Date().toISOString(),operators:operators,data:db},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Affiancamenti_Governance_Dati.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('importFile').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);db=x.data||x;operators=(x.operators&&Array.isArray(x.operators)?x.operators:Object.keys(db)).sort((a,b)=>a.localeCompare(b,'it'));selected=operators[0]||'';persist();renderOps(document.getElementById('search').value);render();alert('Dati caricati correttamente.')}catch(err){alert('File dati non valido.')}};rd.readAsText(f)});
document.getElementById('search').addEventListener('input',e=>renderOps(e.target.value));
renderOps();render();
</script></body></html>
